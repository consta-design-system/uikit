name: Tests
on:
  push:
    branches: master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Отмена дублей запусков (замена rokroskar/workflow-run-cleanup-action)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Установка yarn
        run: yarn policies set-version 1.22.22

      - name: Установка зависимостей
        run: yarn add "install-peers-cli@https://github.com/evless/install-peers-cli#fix-yarn-policies" && yarn --frozen-lockfile

      # На Node 26 установка playwright может зависать (регрессия
      # "hang at shutdown", nodejs/node#64274), поэтому:
      #  1) CLI запускается напрямую через node, без обёртки yarn;
      #  2) ставится только chrome-headless-shell (--only-shell) — именно его
      #     требует vitest в headless-режиме (см. browser.headless в vite.config.ts);
      #  3) каждый запуск обёрнут в timeout, при зависании — повтор (до 3 раз);
      #  4) после установки проверяем, что бинарник действительно на диске,
      #     иначе шаг падает сразу, а не на тестах с непонятной ошибкой.
      #  Важно: шаги Actions выполняются с `bash -e -o pipefail`, поэтому
      #  используется `timeout ... || code=$?` — иначе скрипт упадёт
      #  с кодом 124, не дойдя до проверки.
      #  5) таймаут 2м с запасом: обычно установка занимает секунд 20.
      - name: Установка chromium (headless shell)
        run: |
          for i in 1 2 3; do
            code=0
            PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1 DEBUG=pw:install timeout 2m node ./node_modules/playwright/cli.js install chromium --only-shell || code=$?
            if [ "$code" -eq 0 ]; then
              break
            fi
            echo "::warning::Попытка $i не удалась (код $code), повторяем..."
          done

          SHELL_BIN=$(find "$HOME/.cache/ms-playwright" -type f -path '*chrome-headless-shell*/chrome-headless-shell' | head -n 1)
          if [ -z "$SHELL_BIN" ] || [ ! -x "$SHELL_BIN" ]; then
            echo "chrome-headless-shell не установлен после установки (см. логи pw:install выше)"
            exit 1
          fi
          echo "Установлен: $SHELL_BIN"

      - name: Проверка TS
        run: yarn run test:ts
      - name: Unit тесты
        run: yarn run test:unit
      - name: Проверка eslint & stylelint
        run: yarn run lint
      - name: Проверка орфографии
        run: yarn run test:cspell
      - name: Проверка babel-plugin-reatom-name
        run: yarn run test:babel-plugin-reatom-name
