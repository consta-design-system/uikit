name: Tests
on:
  push:
    branches: master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Отмена дублей запусков (замена rokroskar/workflow-run-cleanup-action)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Установка yarn
        run: yarn policies set-version 1.22.22

      - name: Установка зависимостей
        run: yarn add "install-peers-cli@https://github.com/evless/install-peers-cli#fix-yarn-policies" && yarn --frozen-lockfile

      # На Node 26 есть регрессия "hang at shutdown" (nodejs/node#64274):
      # процесс не завершается после успешной установки chromium, из-за чего
      # джоба зависала после шага `yarn playwright install chromium`.
      # Обходные меры:
      #  1) CLI playwright запускается напрямую через node, без обёртки yarn;
      #  2) PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS пропускает запуск
      #     браузера для валидации окружения после установки;
      #  3) timeout убивает зависший процесс; код 124 (убит по таймауту)
      #     считается успехом, т.к. к этому моменту установка уже прошла,
      #     но реальная ошибка установки (другой код выхода) падает как раньше.
      #  Важно: шаги Actions выполняются с `bash -e -o pipefail`, поэтому
      #  используется `timeout ... || code=$?` — иначе скрипт упадёт
      #  с кодом 124, не дойдя до проверки.
      - name: Установка chromium
        run: |
          code=0
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1 timeout 10m node ./node_modules/playwright/cli.js install chromium || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Проверка TS
        run: yarn run test:ts
      - name: Unit тесты
        run: yarn run test:unit
      - name: Проверка eslint & stylelint
        run: yarn run lint
      - name: Проверка орфографии
        run: yarn run test:cspell
      - name: Проверка babel-plugin-reatom-name
        run: yarn run test:babel-plugin-reatom-name
