name: Tests
on:
  push:
    branches: master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Отмена дублей запусков (замена rokroskar/workflow-run-cleanup-action)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Установка yarn
        run: yarn policies set-version 1.22.22

      - name: Установка зависимостей
        run: yarn add "install-peers-cli@https://github.com/evless/install-peers-cli#fix-yarn-policies" && yarn --frozen-lockfile

      # На Node 26 playwright зависает на этапе "extracting archive" —
      # распаковка zip выполняется средствами Node (регрессия nodejs/node#64274).
      # Обёртка yarn здесь не при чём, поэтому обходим Node-распаковку
      # полностью: скачиваем архив через curl и распаковываем системным unzip
      # в стандартный каталог playwright (~/.cache/ms-playwright), включая
      # маркер INSTALLATION_COMPLETE, наличие которого проверяет playwright.
      # Ревизия берётся из node_modules/playwright-core/browsers.json, поэтому
      # версия браузера всегда соответствует playwright из yarn.lock.
      # (Vitest в headless-режиме требует только chrome-headless-shell,
      # см. browser.headless: true в vite.config.ts — полный chromium не нужен.)
      - name: Установка chromium (headless shell)
        run: |
          REV=$(node -p "require('./node_modules/playwright-core/browsers.json').browsers.find(b => b.name === 'chromium-headless-shell').revision")
          DIR="$HOME/.cache/ms-playwright/chromium_headless_shell-$REV"
          URL="https://cdn.playwright.dev/dbazure/download/playwright/builds/chromium/$REV/chromium-headless-shell-linux.zip"

          rm -rf "$DIR"
          mkdir -p "$DIR"
          curl -fL --retry 3 --connect-timeout 30 "$URL" -o /tmp/chrome-headless-shell.zip
          unzip -q /tmp/chrome-headless-shell.zip -d "$DIR"
          touch "$DIR/INSTALLATION_COMPLETE"

          SHELL_BIN=$(find "$DIR" -name chrome-headless-shell -type f | head -n 1)
          if [ -z "$SHELL_BIN" ] || [ ! -x "$SHELL_BIN" ]; then
            echo "chrome-headless-shell не установлен после распаковки"
            exit 1
          fi
          echo "Установлен: $SHELL_BIN"

      - name: Проверка TS
        run: yarn run test:ts
      - name: Unit тесты
        run: yarn run test:unit
      - name: Проверка eslint & stylelint
        run: yarn run lint
      - name: Проверка орфографии
        run: yarn run test:cspell
      - name: Проверка babel-plugin-reatom-name
        run: yarn run test:babel-plugin-reatom-name
